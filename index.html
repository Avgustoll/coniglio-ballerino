<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coniglio Ballerino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
  /* Layout: una scena a schermo intero, cielo sopra e prato sotto, coniglio al centro sul prato */
  :root {
    --sky: #dcd6f7;
    --sky-2: #f3e9ff;
    --grass: #8fcf8a;
    --grass-dark: #5fa864;
    --ink: #3b2f5c;
    --fur: #ffffff;
    --fur-shade: #e6e0f2;
    --pink: #f59ab8;
    --accent: #7b5cd6;
    --display: "Gluten", "Comic Sans MS", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #1d1838; --sky-2: #2c2452; --grass: #2f6b45; --grass-dark: #234f34;
      --ink: #efe9ff; --fur: #f4f1fb; --fur-shade: #cfc6e6; --pink: #f08cb0; --accent: #b9a2ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky: #1d1838; --sky-2: #2c2452; --grass: #2f6b45; --grass-dark: #234f34;
    --ink: #efe9ff; --fur: #f4f1fb; --fur-shade: #cfc6e6; --pink: #f08cb0; --accent: #b9a2ff;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--sky-2), var(--sky) 60%);
    background-color: var(--sky);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .scene {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    padding-block: 28px 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .meadow {
    position: absolute; inset: auto 0 0 0; height: 30%;
    background: var(--grass);
    border-top-left-radius: 50% 40px;
    border-top-right-radius: 50% 40px;
    box-shadow: inset 0 14px 0 var(--grass-dark);
    z-index: 0;
  }
  header { position: relative; z-index: 1; text-align: center; display: grid; gap: 4px; }
  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1; margin: 0;
    color: var(--accent); text-wrap: balance;
  }
  .hint { margin: 0; font-size: 1.05rem; font-weight: 700; opacity: .8; }

  .stage { position: relative; z-index: 1; align-self: end; width: min(320px, 78vw); margin-bottom: 4vh; }
  #bunny {
    display: block; width: 100%; height: auto; cursor: pointer;
    transform-origin: 50% 95%;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.08));
    outline: none;
  }
  #bunny:focus-visible { filter: drop-shadow(0 0 0 var(--accent)) drop-shadow(0 0 6px var(--accent)); }
  .shadow {
    width: 60%; height: 18px; margin: -14px auto 0; border-radius: 50%;
    background: rgba(0,0,0,.15); transition: transform .2s;
  }

  footer { position: relative; z-index: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  footer b { font-family: var(--display); font-size: 1.4rem; color: var(--accent); }

  /* parti del coniglio */
  .fur { fill: var(--fur); }
  .shade { fill: var(--fur-shade); }
  .pink { fill: var(--pink); }
  .ink { fill: var(--ink); }
  #earL, #earR { transform-box: fill-box; transform-origin: 50% 100%; }
  #armL { transform-box: fill-box; transform-origin: 90% 10%; }
  #armR { transform-box: fill-box; transform-origin: 10% 10%; }
  #footL, #footR { transform-box: fill-box; transform-origin: 50% 50%; }
  #eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4s infinite; }
  #tail { transform-box: fill-box; transform-origin: 50% 50%; }

  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes idle { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(2px) scale(1.02, .98); } }
  #bunny.idle { animation: idle 2.4s ease-in-out infinite; }

  /* Mossa 1: saltelli */
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    10%, 60% { transform: translateY(0) scale(1.1, .88); }
    30%, 80% { transform: translateY(-70px) scale(.94, 1.08); }
  }
  @keyframes earsFlap { 0%, 100% { transform: rotate(0); } 25%, 75% { transform: rotate(-22deg); } 50% { transform: rotate(18deg); } }
  @keyframes earsFlapR { 0%, 100% { transform: rotate(0); } 25%, 75% { transform: rotate(22deg); } 50% { transform: rotate(-18deg); } }
  @keyframes armUpL { 0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(120deg); } 40%, 80% { transform: rotate(70deg); } }
  @keyframes armUpR { 0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(-120deg); } 40%, 80% { transform: rotate(-70deg); } }
  #bunny.hop { animation: hop 1.1s ease-in-out; }
  .hop #earL { animation: earsFlap 1.1s ease-in-out; }
  .hop #earR { animation: earsFlapR 1.1s ease-in-out; }
  .hop #armL { animation: armUpL 1.1s ease-in-out; }
  .hop #armR { animation: armUpR 1.1s ease-in-out; }

  /* Mossa 2: dondolio a destra e sinistra */
  @keyframes wiggle {
    0%, 100% { transform: rotate(0) translateX(0); }
    15% { transform: rotate(-14deg) translateX(-18px); }
    35% { transform: rotate(14deg) translateX(18px); }
    55% { transform: rotate(-14deg) translateX(-18px); }
    75% { transform: rotate(14deg) translateX(18px); }
  }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 15%, 55% { transform: rotate(100deg); } 35%, 75% { transform: rotate(40deg); } }
  @keyframes waveR { 0%, 100% { transform: rotate(0); } 15%, 55% { transform: rotate(-40deg); } 35%, 75% { transform: rotate(-100deg); } }
  @keyframes tap { 0%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-10px); } }
  @keyframes tailWag { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(40deg) scale(1.2); } }
  #bunny.wiggle { animation: wiggle 1.3s ease-in-out; }
  .wiggle #armL { animation: wave 1.3s ease-in-out; }
  .wiggle #armR { animation: waveR 1.3s ease-in-out; }
  .wiggle #footL { animation: tap .65s ease-in-out 2; }
  .wiggle #footR { animation: tap .65s ease-in-out .32s 2; }
  .wiggle #tail { animation: tailWag .33s ease-in-out 4; }
  .wiggle #earL { animation: earsFlap .65s ease-in-out 2; }
  .wiggle #earR { animation: earsFlapR .65s ease-in-out 2; }

  /* Mossa 3: piroetta */
  @keyframes spin {
    0% { transform: translateY(0) rotate(0); }
    20% { transform: translateY(8px) scale(1.06, .92) rotate(0); }
    60% { transform: translateY(-50px) rotate(360deg); }
    80% { transform: translateY(6px) scale(1.06, .94) rotate(360deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }
  #bunny.spin { animation: spin 1.2s cubic-bezier(.5,0,.4,1); }
  .spin #armL { animation: armUpL 1.2s ease-in-out; }
  .spin #armR { animation: armUpR 1.2s ease-in-out; }
  .spin #earL { animation: earsFlapR 1.2s ease-in-out; }
  .spin #earR { animation: earsFlap 1.2s ease-in-out; }

  /* cuoricini e note che volano */
  .pop {
    position: absolute; z-index: 2; pointer-events: none;
    font-family: var(--display); font-weight: 800; font-size: 1.8rem;
    animation: float 1.4s ease-out forwards;
  }
  @keyframes float {
    0% { opacity: 0; transform: translate(0, 0) scale(.4) rotate(0); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), -160px) scale(1.2) rotate(var(--rot)); }
  }

  @media (prefers-reduced-motion: reduce) {
    #bunny.idle, #eyes { animation: none; }
    #bunny.hop, #bunny.wiggle, #bunny.spin { animation-duration: 2.4s; }
    .pop { animation-duration: 2s; }
  }
</style>
<style>body{margin:0}</style>
</head>
<body>
<main class="scene">
  <div class="meadow" aria-hidden="true"></div>
  <header>
    <h1>Coniglio Ballerino</h1>
    <p class="hint">Toccalo e lo fai ballare!</p>
  </header>

  <div class="stage" id="stage">
    <svg id="bunny" class="idle" viewBox="0 0 200 260" role="button" tabindex="0" aria-label="Fai ballare il coniglio">
      <!-- orecchie -->
      <g id="earL">
        <ellipse class="fur" cx="72" cy="50" rx="17" ry="46" transform="rotate(-10 72 50)"/>
        <ellipse class="pink" cx="72" cy="54" rx="8" ry="34" transform="rotate(-10 72 54)"/>
      </g>
      <g id="earR">
        <ellipse class="fur" cx="128" cy="50" rx="17" ry="46" transform="rotate(10 128 50)"/>
        <ellipse class="pink" cx="128" cy="54" rx="8" ry="34" transform="rotate(10 128 54)"/>
      </g>
      <!-- coda -->
      <circle id="tail" class="shade" cx="152" cy="200" r="15"/>
      <!-- piedi -->
      <ellipse id="footL" class="fur" cx="72" cy="244" rx="26" ry="13"/>
      <ellipse id="footR" class="fur" cx="128" cy="244" rx="26" ry="13"/>
      <!-- corpo -->
      <ellipse class="fur" cx="100" cy="190" rx="52" ry="56"/>
      <ellipse class="shade" cx="100" cy="200" rx="30" ry="36"/>
      <!-- braccia -->
      <ellipse id="armL" class="fur" cx="56" cy="178" rx="12" ry="24" transform="rotate(20 56 178)"/>
      <ellipse id="armR" class="fur" cx="144" cy="178" rx="12" ry="24" transform="rotate(-20 144 178)"/>
      <!-- testa -->
      <circle class="fur" cx="100" cy="116" r="48"/>
      <circle class="pink" cx="70" cy="130" r="9" opacity=".55"/>
      <circle class="pink" cx="130" cy="130" r="9" opacity=".55"/>
      <g id="eyes">
        <circle fill="#3b2f5c" cx="82" cy="110" r="7"/>
        <circle fill="#3b2f5c" cx="118" cy="110" r="7"/>
        <circle fill="#ffffff" cx="84.5" cy="107.5" r="2.3"/>
        <circle fill="#ffffff" cx="120.5" cy="107.5" r="2.3"/>
      </g>
      <path class="pink" d="M93 124 Q100 120 107 124 Q100 133 93 124 Z"/>
      <path d="M100 130 Q100 138 92 140 M100 130 Q100 138 108 140" fill="none" stroke="#3b2f5c" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="shadow" id="shadow"></div>
  </div>

  <footer>Balli fatti: <b id="count">0</b></footer>
</main>

<script>
  const bunny = document.getElementById('bunny');
  const stage = document.getElementById('stage');
  const countEl = document.getElementById('count');
  const moves = ['hop', 'wiggle', 'spin'];
  const pops = ['♥', '♪', '♫', '✦', '♥'];
  const popColors = ['var(--pink)', 'var(--accent)', 'var(--grass-dark)'];
  let count = 0, last = '', dancing = false, audio;

  function boing() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'triangle';
        o.frequency.value = f;
        const t = audio.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g).connect(audio.destination);
        o.start(t); o.stop(t + 0.22);
      });
    } catch (e) {}
  }

  function burst() {
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('span');
      s.className = 'pop';
      s.textContent = pops[Math.floor(Math.random() * pops.length)];
      s.style.color = popColors[i % popColors.length];
      s.style.left = (30 + Math.random() * 40) + '%';
      s.style.top = (10 + Math.random() * 30) + '%';
      s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      s.style.setProperty('--rot', (Math.random() * 80 - 40) + 'deg');
      s.style.animationDelay = (i * 0.08) + 's';
      stage.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }
  }

  function dance() {
    if (dancing) return;
    dancing = true;
    let move;
    do { move = moves[Math.floor(Math.random() * moves.length)]; } while (move === last);
    last = move;
    bunny.classList.remove('idle');
    void bunny.getBoundingClientRect();
    bunny.classList.add(move);
    count++;
    countEl.textContent = count;
    boing();
    burst();
    bunny.addEventListener('animationend', function done(e) {
      if (e.target !== bunny) return;
      bunny.removeEventListener('animationend', done);
      bunny.classList.remove(move);
      bunny.classList.add('idle');
      dancing = false;
    });
  }

  bunny.addEventListener('pointerdown', dance);
  bunny.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dance(); }
  });
</script>
</body>
</html>
